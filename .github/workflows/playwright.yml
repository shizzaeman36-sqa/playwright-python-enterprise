name: Playwright Enterprise Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Code Checkout
      uses: actions/checkout@v4

    - name: Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-playwright pytest-html pytest-xdist python-dotenv

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    - name: Execute Playwright Tests
      run: pytest --tracing=retain-on-failure --html=report.html --self-contained-html

    - name: Upload HTML Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-execution-report
        path: report.html